<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たのしいスロット</title>
<link rel="stylesheet" href="file/sandbox/ffslot/style.css">
</head>
<body>

<div class="machine">

<h1>たのしいスロット</h1>

<div class="reels">
<div class="reel-window"><div class="reel" id="reel0"></div></div>
<div class="reel-window"><div class="reel" id="reel1"></div></div>
<div class="reel-window"><div class="reel" id="reel2"></div></div>
</div>

<div class="info">
Gill: <span id="credit">100</span><br>
HIGH SCORE: <span id="highScore">100</span>
</div>

<br>

<div class="buttons">
<button id="spin">SPIN</button>
<button id="reset">RESET</button>
</div>

<div id="result"></div>

<div class="copyright">
このスロットに使用されている画像の著作権は@nek7moに帰属します。<br>
現在の絵柄は4種類です。<br>
<span id="clearScore">HIGH SCOREを削除</span>
</div>

</div>

<script src="file/sandbox/ffslot/script.js"></script>
</body>
</html>
